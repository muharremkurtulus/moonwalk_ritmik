<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moonwalk Ritmik Sayma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@500;700&display=swap');

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #050510;
            color: white;
            overflow-x: hidden;
        }

        .title-font {
            font-family: 'Press Start 2P', cursive;
        }

        /* Neon Zemin Efektleri (Billie Jean Tarzı) */
        .floor-box {
            width: 100px;
            height: 100px;
            background-color: #1a1a2e;
            border: 3px solid #333;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: #555;
            transition: all 0.5s ease;
            position: relative;
            flex-shrink: 0;
            box-shadow: inset 0 0 10px #000;
        }

        .floor-box.active {
            background-color: #ffd700;
            border-color: #ffffff;
            color: #000;
            box-shadow: 0 0 20px #ffd700, inset 0 0 15px #fff;
        }

        .floor-box.completed {
            background-color: #ff007f;
            border-color: #ff99cc;
            color: white;
            box-shadow: 0 0 15px #ff007f, inset 0 0 10px #ff99cc;
        }

        /* Karakter Animasyonları */
        .mj-character {
            position: absolute;
            bottom: 100%; /* Kutunun tam üstüne hizalar */
            left: 50%;
            margin-bottom: 0px; 
            width: 100px; /* Görünürlüğü artırmak için ideal boyut */
            height: 100px;
            background-size: contain;
            background-position: bottom center; /* Ayaklar her zaman yere (kutuya) bassın */
            background-repeat: no-repeat;
            z-index: 10;
            /* Placeholder CSS Silüeti (Resim yoksa veya yüklenmezse görünür) */
            background-color: rgba(0, 0, 0, 0.8);
            clip-path: polygon(40% 0, 60% 0, 60% 20%, 80% 20%, 80% 40%, 60% 40%, 60% 60%, 80% 60%, 80% 100%, 60% 100%, 60% 70%, 40% 70%, 40% 100%, 20% 100%, 20% 60%, 40% 60%, 40% 40%, 20% 40%, 20% 20%, 40% 20%);
        }

        .mj-has-image {
            background-color: transparent !important;
            clip-path: none !important;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.8));
        }

        .moonwalk-slide {
            animation: slideIn 0.5s ease-out forwards;
        }

        @keyframes slideIn {
            0% { transform: translateX(calc(-50% - 100px)); opacity: 0; }
            100% { transform: translateX(-50%); opacity: 1; }
        }

        /* Hata Efekti */
        .error-flash {
            animation: flashRed 0.4s ease;
        }

        @keyframes flashRed {
            0%, 100% { background-color: #050510; }
            50% { background-color: #4a0000; }
        }

        /* Seviye Butonları */
        .level-btn {
            background: linear-gradient(45deg, #1a0b2e, #4b0082);
            border: 2px solid #a855f7;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
            transition: all 0.3s ease;
        }
        .level-btn:hover:not(.locked) {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.8);
        }
        .level-btn.locked {
            background: #1f2937;
            border-color: #374151;
            box-shadow: none;
            color: #6b7280;
            cursor: not-allowed;
        }

        /* Özel Scrollbar */
        ::-webkit-scrollbar {
            height: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #111;
        }
        ::-webkit-scrollbar-thumb {
            background: #ff007f;
            border-radius: 5px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col" id="gameBody">

    <script>
        // 2 adet resim yolunu buraya tanımlıyoruz (Animasyon için)
        const MJ_RESIM_1 = "images/mj1.png"; 
        const MJ_RESIM_2 = "images/mj2.png"; 
    </script>

    <!-- ANA MENÜ: MOD SEÇİMİ (İleri / Geri) -->
    <div id="modeMenu" class="flex-1 flex flex-col items-center justify-center p-6 w-full max-w-4xl mx-auto">
        <h1 class="title-font text-3xl md:text-5xl text-center mb-4 text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-yellow-500 drop-shadow-[0_0_10px_rgba(255,20,147,0.8)]">
            MOONWALK SAYACI
        </h1>
        <p class="text-xl mb-12 text-gray-300 text-center">Nasıl saymak istersin?</p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-2xl">
            <button onclick="openLevelMenu('forward')" class="bg-gradient-to-br from-blue-900 to-blue-600 hover:from-blue-800 hover:to-blue-500 text-white border-2 border-blue-400 p-8 rounded-2xl shadow-[0_0_20px_rgba(59,130,246,0.6)] transform hover:scale-105 transition-all flex flex-col items-center gap-4">
                <span class="text-6xl">🎵</span>
                <span class="text-3xl font-bold title-font text-blue-200">İLERİ</span>
                <span class="text-lg text-blue-100">Ritmik Sayma</span>
            </button>
            
            <button onclick="openLevelMenu('backward')" class="bg-gradient-to-br from-purple-900 to-purple-600 hover:from-purple-800 hover:to-purple-500 text-white border-2 border-purple-400 p-8 rounded-2xl shadow-[0_0_20px_rgba(168,85,247,0.6)] transform hover:scale-105 transition-all flex flex-col items-center gap-4">
                <span class="text-6xl">✨</span>
                <span class="text-3xl font-bold title-font text-purple-200">GERİ</span>
                <span class="text-lg text-purple-100">Ritmik Sayma</span>
            </button>
        </div>
    </div>

    <!-- SEVİYE SEÇİM MENÜSÜ -->
    <div id="levelMenuScreen" class="hidden flex-1 flex flex-col items-center justify-center p-6 w-full max-w-4xl mx-auto">
        <button onclick="showModeMenu()" class="mb-8 bg-gray-800 hover:bg-gray-700 text-white px-6 py-2 rounded-lg font-bold border border-gray-600 self-start">
            &larr; Geri Dön
        </button>
        
        <h2 id="menuTitle" class="title-font text-2xl md:text-4xl text-center mb-8 text-yellow-400 drop-shadow-[0_0_10px_#ffd700]">
            SEVİYE SEÇ
        </h2>

        <div class="grid grid-cols-2 md:grid-cols-3 gap-6 w-full" id="levelContainer">
            <!-- Seviyeler JS ile buraya yüklenecek -->
        </div>
    </div>

    <!-- OYUN EKRANI -->
    <div id="gameScreen" class="hidden flex-1 flex-col w-full h-full max-h-screen">
        
        <!-- Üst Bilgi Barı -->
        <div class="flex justify-between items-center p-4 bg-gray-900 border-b border-pink-600 shadow-[0_0_15px_#ff007f]">
            <button onclick="showModeMenu()" class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-lg font-bold border border-gray-600">
                &larr; Çıkış
            </button>
            <h2 id="levelTitle" class="text-xl md:text-3xl font-bold text-yellow-400 drop-shadow-[0_0_8px_#ffd700]">
                5'er Ritmik Sayma
            </h2>
            <div class="text-lg md:text-xl font-bold text-pink-500 text-right">
                <span id="targetModeText">Hedef:</span> <span id="targetNumber" class="text-white">100</span>
            </div>
        </div>

        <!-- Dans Pisti (Kutular) -->
        <div class="flex-1 flex items-center w-full overflow-hidden relative bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-blue-900 via-[#050510] to-[#050510]">
            <div class="absolute top-0 left-1/4 w-32 h-full bg-blue-500/10 blur-3xl skew-x-12"></div>
            <div class="absolute top-0 right-1/4 w-32 h-full bg-pink-500/10 blur-3xl -skew-x-12"></div>

            <div id="track" class="flex gap-4 px-8 pt-28 pb-12 w-full overflow-x-auto items-center min-h-[300px] scroll-smooth">
                <!-- Kutular buraya gelecek -->
            </div>
        </div>

        <!-- Kontrol Paneli (Giriş) -->
        <div class="p-6 bg-gray-900 border-t border-yellow-500 flex flex-col items-center justify-center pb-8 shadow-[0_0_20px_#ffd700]">
            <p id="questionText" class="text-xl md:text-2xl mb-4 text-center font-bold">
                Sıradaki sayı nedir?
            </p>
            <div class="flex gap-4 max-w-md w-full">
                <input type="number" id="numberInput" 
                    class="flex-1 bg-gray-800 text-white text-3xl text-center rounded-xl border-2 border-pink-500 focus:outline-none focus:border-yellow-400 focus:shadow-[0_0_15px_#ffd700] p-3"
                    placeholder="?" autocomplete="off">
                <button id="submitBtn" onclick="checkAnswer()" 
                    class="bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white font-bold py-3 px-6 rounded-xl border-2 border-white shadow-[0_0_15px_#ff007f] transform hover:scale-105 transition-all text-xl">
                    Git!
                </button>
            </div>
        </div>
    </div>

    <!-- Başarı Mesajı Modalı -->
    <div id="successModal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
        <div class="bg-gray-900 border-4 border-yellow-400 rounded-2xl p-8 max-w-sm w-full text-center shadow-[0_0_30px_#ffd700]">
            <h2 class="title-font text-2xl text-yellow-400 mb-4">HARİKA!</h2>
            <p class="text-xl mb-6">Bu bölümü başarıyla tamamladın ve yeni seviyenin kilidini açtın!</p>
            <button onclick="showModeMenu()" class="bg-pink-600 text-white font-bold py-3 px-8 rounded-xl text-xl shadow-[0_0_15px_#ff007f] hover:bg-pink-500">
                Devam Et
            </button>
        </div>
    </div>

    <script>
        // Oyun Ayarları ve Verileri
        const levels = [
            { mult: 5, max: 100 }, 
            { mult: 6, max: 60 },  
            { mult: 7, max: 70 },
            { mult: 8, max: 80 },
            { mult: 9, max: 90 },
            { mult: 10, max: 100 }
        ];

        let currentMode = 'forward'; // 'forward' veya 'backward'
        let currentLevelObj = null;
        let currentStep = 1; 
        let totalSteps = 0;
        
        // Animasyon Değişkenleri
        let animInterval = null;
        let isMj1 = true;

        // DOM Elementleri
        const modeMenu = document.getElementById('modeMenu');
        const levelMenuScreen = document.getElementById('levelMenuScreen');
        const gameScreen = document.getElementById('gameScreen');
        const levelContainer = document.getElementById('levelContainer');
        const track = document.getElementById('track');
        const numberInput = document.getElementById('numberInput');
        const levelTitle = document.getElementById('levelTitle');
        const targetNumberDisplay = document.getElementById('targetNumber');
        const targetModeText = document.getElementById('targetModeText');
        const menuTitle = document.getElementById('menuTitle');
        const gameBody = document.getElementById('gameBody');
        const successModal = document.getElementById('successModal');
        const questionText = document.getElementById('questionText');

        function showModeMenu() {
            stopMjAnimation();
            gameScreen.classList.add('hidden');
            levelMenuScreen.classList.add('hidden');
            successModal.classList.add('hidden');
            modeMenu.classList.remove('hidden');
        }

        function openLevelMenu(mode) {
            currentMode = mode;
            modeMenu.classList.add('hidden');
            levelMenuScreen.classList.remove('hidden');
            
            menuTitle.innerText = mode === 'forward' ? 'İLERİ SEVİYELER' : 'GERİ SEVİYELER';
            menuTitle.className = mode === 'forward' 
                ? 'title-font text-2xl md:text-4xl text-center mb-8 text-blue-400 drop-shadow-[0_0_10px_#3b82f6]'
                : 'title-font text-2xl md:text-4xl text-center mb-8 text-purple-400 drop-shadow-[0_0_10px_#a855f7]';
            
            renderLevelMenu();
        }

        function renderLevelMenu() {
            levelContainer.innerHTML = '';

            levels.forEach((lvl, index) => {
                const btn = document.createElement('button');
                
                // Renk teması ileri-geri ayrımı
                const btnColorClass = currentMode === 'forward' 
                    ? 'border-blue-400 shadow-[0_0_15px_rgba(59,130,246,0.4)] hover:shadow-[0_0_25px_rgba(59,130,246,0.8)] from-[#0f172a] to-[#1e3a8a]'
                    : 'border-purple-400 shadow-[0_0_15px_rgba(168,85,247,0.4)] hover:shadow-[0_0_25px_rgba(168,85,247,0.8)] from-[#1a0b2e] to-[#4b0082]';

                btn.className = `level-btn rounded-2xl p-6 flex flex-col items-center justify-center gap-2 border-2 bg-gradient-to-br ${btnColorClass} text-white transition-all duration-300`;
                
                const icon = currentMode === 'forward' ? '🎵' : '✨';
                
                btn.innerHTML = `
                    <span class="text-4xl">${icon}</span>
                    <span class="text-2xl font-bold">${lvl.mult}'şar Sayma</span>
                    <span class="text-sm opacity-80">${currentMode === 'forward' ? lvl.max + "'a kadar" : lvl.max + "'den geriye"}</span>
                `;

                btn.onclick = () => startGame(index);
                
                levelContainer.appendChild(btn);
            });
        }

        function startGame(levelIndex) {
            currentLevelObj = levels[levelIndex];
            currentStep = 1; 
            totalSteps = currentLevelObj.max / currentLevelObj.mult;

            levelMenuScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            successModal.classList.add('hidden');

            const modeText = currentMode === 'forward' ? "İleri" : "Geri";
            levelTitle.innerText = `${currentLevelObj.mult}'şar ${modeText} Sayma`;
            
            if (currentMode === 'forward') {
                targetModeText.innerText = "Hedef:";
                targetNumberDisplay.innerText = currentLevelObj.max;
            } else {
                targetModeText.innerText = "Bitiş:";
                targetNumberDisplay.innerText = currentLevelObj.mult; // Geri sayımda en son sayı çarpanın kendisidir
            }
            
            buildTrack();
            updateUI();
            startMjAnimation(); // Animasyonu başlat

            setTimeout(() => {
                scrollToCurrentBox();
                numberInput.focus();
            }, 100);
        }

        function getBoxValue(stepIndex) {
            if (currentMode === 'forward') {
                return stepIndex * currentLevelObj.mult;
            } else {
                return currentLevelObj.max - ((stepIndex - 1) * currentLevelObj.mult);
            }
        }

        function buildTrack() {
            track.innerHTML = '';
            const spacer = document.createElement('div');
            spacer.className = "min-w-[50px] md:min-w-[200px]";
            track.appendChild(spacer);

            for (let i = 1; i <= totalSteps; i++) {
                const box = document.createElement('div');
                box.className = 'floor-box';
                box.id = `box-${i}`;
                
                const textSpan = document.createElement('span');
                textSpan.id = `text-${i}`;
                box.appendChild(textSpan);
                
                track.appendChild(box);
            }

            const spacerEnd = document.createElement('div');
            spacerEnd.className = "min-w-[50vw]";
            track.appendChild(spacerEnd);
        }

        function startMjAnimation() {
            stopMjAnimation(); // Önceki varsa temizle
            animInterval = setInterval(() => {
                const mjElements = document.querySelectorAll('.mj-character');
                mjElements.forEach(mj => {
                    isMj1 = !isMj1;
                    mj.style.backgroundImage = `url('${isMj1 ? MJ_RESIM_1 : MJ_RESIM_2}')`;
                });
            }, 300); // Her 300ms'de bir resmi değiştir (Hızı buradan ayarlayabilirsin)
        }

        function stopMjAnimation() {
            if (animInterval) {
                clearInterval(animInterval);
                animInterval = null;
            }
        }

        function updateUI() {
            for (let i = 1; i <= totalSteps; i++) {
                const box = document.getElementById(`box-${i}`);
                const text = document.getElementById(`text-${i}`);
                
                box.classList.remove('completed', 'active');
                const existingMj = box.querySelector('.mj-character');
                if (existingMj) box.removeChild(existingMj);

                if (i < currentStep) {
                    box.classList.add('completed');
                    text.innerText = getBoxValue(i);
                } else if (i === currentStep) {
                    box.classList.add('active');
                    text.innerText = getBoxValue(i);
                    
                    const mj = document.createElement('div');
                    mj.className = 'mj-character moonwalk-slide';
                    mj.style.backgroundImage = `url('${isMj1 ? MJ_RESIM_1 : MJ_RESIM_2}')`;
                    mj.classList.add('mj-has-image');
                    box.appendChild(mj);
                } else if (i === currentStep + 1) {
                    text.innerText = "?";
                } else {
                    text.innerText = "";
                }
            }

            if (currentStep < totalSteps) {
                const currentVal = getBoxValue(currentStep);
                const modeWord = currentMode === 'forward' ? "sayarken" : "geriye sayarken";
                questionText.innerHTML = `<span class="text-pink-500 font-bold">${currentLevelObj.mult}'şar</span> ${modeWord} <span class="text-yellow-400 font-bold">${currentVal}</span>'den sonra ne gelir?`;
                numberInput.value = '';
                numberInput.focus();
            }
        }

        function scrollToCurrentBox() {
            const currentBoxElement = document.getElementById(`box-${currentStep}`);
            if (currentBoxElement) {
                currentBoxElement.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }
        }

        function checkAnswer() {
            if (currentStep >= totalSteps) return;

            const userAnswer = parseInt(numberInput.value);
            const correctAnswer = getBoxValue(currentStep + 1);

            if (userAnswer === correctAnswer) {
                currentStep++;
                updateUI();
                scrollToCurrentBox();

                if (currentStep === totalSteps) {
                    setTimeout(levelComplete, 600);
                }
            } else {
                gameBody.classList.add('error-flash');
                numberInput.value = '';
                setTimeout(() => {
                    gameBody.classList.remove('error-flash');
                }, 400);
            }
        }

        function levelComplete() {
            stopMjAnimation();
            successModal.classList.remove('hidden');
        }

        numberInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });

    </script>
</body>
</html>
